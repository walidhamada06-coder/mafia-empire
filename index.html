<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGRO ERP ENTERPRISE</title>
  <style>
    :root {
      --bg-dark: #0a0f0d;
      --card-bg: #141c18;
      --text-light: #e0e6e3;
      --accent-green: #00e676;
      --accent-gold: #ffc107;
      --accent-red: #ff5252;
      --sidebar-width: 260px;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    /* Layout */
    #sidebar {
      width: var(--sidebar-width);
      background: #0d1410;
      border-left: 1px solid #1e2d25;
      display: flex;
      flex-direction: column;
    }
    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .header {
      background: #0d1410;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e2d25;
    }
    .content-area { padding: 25px; }
    
    /* UI Components */
    .card-panel {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid #1e2d25;
    }
    .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .stat-card {
      background: #101713;
      padding: 15px;
      border-radius: 8px;
      border-right: 4px solid var(--accent-green);
    }
    .stat-val { font-size: 24px; font-weight: bold; margin-top: 5px; color: var(--accent-green); }
    
    /* Auth Modal */
    #login-page {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 15, 13, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .login-box {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 12px;
      width: 320px;
      border: 1px solid var(--accent-green);
      text-align: center;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #1e2d25;
      background: #0a0f0d;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background: var(--accent-green);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول -->
  <div id="login-page">
    <div class="login-box">
      <h2 style="color: var(--accent-green);">🌱 AGRO ERP</h2>
      <p>تسجيل الدخول للنظام</p>
      <form onsubmit="handleLogin(event)">
        <input type="text" id="username" placeholder="اسم المستخدم" value="المشرف العام" required>
        <input type="password" id="password" placeholder="كلمة المرور" value="123456" required>
        <button type="submit">دخول السيستم</button>
      </form>
    </div>
  </div>

  <!-- الشريط الجانبي -->
  <div id="sidebar">
    <div style="padding: 20px; font-weight: bold; color: var(--accent-green); font-size: 18px;">
      🌿 AGRO ERP
    </div>
    <div style="padding: 10px; font-size: 14px; color: #aaa;">
      <ul>
        <li style="margin-bottom: 10px; cursor: pointer; color:#fff;">📊 الداشبورد والتحليلات</li>
        <li style="margin-bottom: 10px; cursor: pointer;">🧾 الفواتير</li>
        <li style="margin-bottom: 10px; cursor: pointer;">📦 رصيد المخزن والخامات</li>
      </ul>
    </div>
  </div>

  <!-- المحتوى الرئيسي -->
  <div id="main-content">
    <div class="header">
      <div><b>المرزعة الذكية (Supabase)</b></div>
      <div>
        <span id="active-user-name">المشرف العام</span>
        <button onclick="logout()" style="width: auto; padding: 5px 15px; margin-right: 10px; background: var(--accent-red); color:#fff;">تسجيل الخروج</button>
      </div>
    </div>

    <div class="content-area">
      <!-- 🚀 كارت التنبؤ بالنفاد المضاف حديثاً -->
      <div class="card-panel" style="border-right: 4px solid var(--accent-gold);">
        <h3 style="margin-top:0; color:var(--accent-gold);">⚠️ مؤشر كفاية المخزون والتنبؤ بالنفاد</h3>
        <div id="stock-alerts-list">
          <!-- التنبيهات بتظهر هنا -->
        </div>
      </div>

      <!-- كروت الإحصائيات -->
      <div class="card-panel">
        <h3>📊 التحليلات التشغيلية والمالية الشاملة</h3>
        <div class="grid-4">
          <div class="stat-card">
            <div>الرؤوس الحية</div>
            <div class="stat-val">50</div>
          </div>
          <div class="stat-card">
            <div>إجمالي المبيعات</div>
            <div class="stat-val">0 ج.م</div>
          </div>
          <div class="stat-card">
            <div>المصروفات</div>
            <div class="stat-val">0 ج.م</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. نظام تسجيل الدخول الخفيف والآمن
    function handleLogin(e) {
      if (e) e.preventDefault();
      const user = document.getElementById('username').value;
      document.getElementById('active-user-name').innerText = user || 'المشرف العام';
      document.getElementById('login-page').style.display = 'none';
    }

    function logout() {
      document.getElementById('login-page').style.display = 'flex';
    }

    // بيانات افتراضية للمخزون في حال عدم الاتصال المباشر
    const localStore = {
      stock: [
        { name: "ذرة صفراء", qty_kg: 1200 },
        { name: "صويا 44%", qty_kg: 4500 },
        { name: "رائبة مركزة", qty_kg: 250 }
      ]
    };

    // 2. دالة حساب التنبؤ بنفاد المخزون
    async function checkStockDepletion() {
      const alertContainer = document.getElementById('stock-alerts-list');
      if (!alertContainer) return;

      const dailyConsumptionKg = 500; // متوسط الاستهلاك اليومي (كجم)
      let items = localStore.stock;

      // محاولة سحب البيانات من Supabase لو متصلة
      if (typeof _supabase !== 'undefined') {
        try {
          let { data } = await _supabase.from('feed_stock').select('*');
          if (data && data.length > 0) items = data;
        } catch(e) { console.log('يعتمد على الستور المحلي'); }
      }

      alertContainer.innerHTML = '';

      items.forEach(item => {
        const qty = Number(item.qty_kg || item.quantity || 0);
        const name = item.name || item.material_name || 'خامة';
        const daysLeft = Math.floor(qty / dailyConsumptionKg);

        let statusColor = 'var(--accent-green)';
        let warningText = `يكفي لمدة ${daysLeft} يوم تشغيل.`;

        if (daysLeft <= 3) {
          statusColor = 'var(--accent-red)';
          warningText = `🚨 خطر! المخزون حرج جداً ويكفي لمدة ${daysLeft} أيام فقط!`;
        } else if (daysLeft <= 7) {
          statusColor = 'var(--accent-gold)';
          warningText = `⚠️ تنبيه: يفضل عمل طلب شراء جديد (يكفي ${daysLeft} أيام).`;
        }

        alertContainer.innerHTML += `
          <div style="padding: 12px; background: #0e1511; border-radius: 8px; margin-bottom: 8px; display:flex; justify-content:space-between; align-items:center; border-right: 4px solid ${statusColor};">
            <span><b>${name}</b> (الرصيد: ${qty} كجم)</span>
            <span style="color:${statusColor}; font-weight:bold; font-size:14px;">${warningText}</span>
          </div>
        `;
      });
    }

    // تشغيل التنبيهات مباشرة
    window.onload = () => {
      checkStockDepletion();
    };
  </script>
</body>
</html>
